<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  
    <style>
        *{box-sizing: border-box;}
        body { font-family: monospace; font-size: 0.8rem; background-color: #f4f5f7; color: #333333; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh;} 
        nav { width: 100%; background-color: #295d84; color: white; padding: 10px 20px;  display: flex; justify-content: space-between; align-items: center;} 
        .nav2 { width: 100%; display: flex; justify-content: space-between; background-color: #ffffff; padding: 5px 20px;   color: #666; border-bottom: 1px solid #dcdcdc; font-size: 0.6rem;} 
        .container { background-color: #ffffff; max-width: 500px; width: 95%; margin: 10px 10px 0px; padding: 15px; border: 1px solid #dcdcdc;  border-radius: 4px;   box-shadow: 0 2px 5px rgba(0, 0, 0, 0.02);  } 
        a {display: block; margin-bottom: 5px; text-decoration: none; color: #5f8949; } 
        input[type="text"] { background: transparent; border: none; outline: none; color: #fff; } 
    </style>
</head>
<body> 
    <nav>
        <span>Public</span>
        <input type="text" id="cmd" autofocus autocomplete="off" spellcheck="false">
        <span id="status">&#x25FC;</span>  
    </nav>  
    <div class="nav2">
      <span>pub/index</span>
      <span id="loading"></span>
      <span id="lastSeen"></span> 
    </div> 

    <div class="container">    
      <a href="https://www.google.com/search?q=calculator">📟 Calculator</a>
      <a href="https://mp3juice.co">🎧 Download Mp3</a>  
      <a href="https://ssstik.io/id">🎬 Download Tiktok Video</a>  
      <a href="log.html">📝 Logbook</a>
        <a href="https://www.google.com/search?q=proxy">📡 Proxy</a>
        <a href="https://forms.gle/mF35fpoFdKxmHwiq7">💧 Suhu Kamar</a>  
    </div> 
  
    <script>   
      const SUPABASE_URL = "https://qjwmhtnfowkmwoflwhzy.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_-vCSXzmIWSM9kn7VHWRhjg_g2B5IYXF"; 
      const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);  
  
        const inputField = document.getElementById('cmd'); 

        let loadingInterval = null; 

        inputField.addEventListener('keypress', async function (e) {
            if (e.key === 'Enter') {
                const rawInput = inputField.value.trim();
                if (!rawInput) return;  
                inputField.value = '';  
 
                const loadingSpan = document.getElementById('loading');
                let dotCount = 0; 
                loadingInterval = setInterval(() => {
                    dotCount = (dotCount + 1) % 4; 
                    loadingSpan.textContent = '.'.repeat(dotCount);
                }, 200);  

                try {
                    const { data, error } = await supabaseClient
                        .from('commands')
                        .select('url')
                        .eq('command', rawInput)
                        .single(); 
                    clearInterval(loadingInterval);
                    loadingSpan.textContent = ''; 
                    if (error || !data) { 
                        loadingSpan.textContent = 'x';
                        setTimeout(() => { loadingSpan.textContent = ''; }, 1000);
                    } else {
                        setTimeout(() => {
                            window.location.href = data.url;
                        }, 500);
                    }
                } catch (err) {
                    console.log(err);
                    clearInterval(loadingInterval);
                    loadingSpan.textContent = '';
                }
            }
        });

      const urlParams = new URLSearchParams(window.location.search);
      const roomId = urlParams.get("r"); 
      const statusEl = document.getElementById("status");
  
      function updateStatusColor(userName) {
        if (userName.length % 2 === 0) {
          statusEl.style.color = "#85be66"; 
        } else {
          statusEl.style.color = "#008fb7"; 
        }
      }
      async function cekPesanTerakhir() {
        if (!roomId) {
          statusEl.style.color = "gray";
          return;
        } 
        const { data, error } = await supabaseClient
          .from("messages")
          .select("user_name")
          .eq("room_id", roomId)
          .order("created_at", { ascending: false })
          .limit(1); 
        if (error) { 
          statusEl.style.color = "gray";
          return;
        } 
        if (data && data.length > 0) {
          updateStatusColor(data[0].user_name);
        } else { 
          statusEl.style.color = "gray";
        }
      } 
      cekPesanTerakhir();
  
      supabaseClient
        .channel(`cek_status_${roomId}`)
        .on(
          "postgres_changes",
          {
            event: "INSERT",
            schema: "public",
            table: "messages",
            filter: `room_id=eq.${roomId}`,
          },
          (payload) => {
            updateStatusColor(payload.new.user_name);
          }
        )
        .subscribe();

      async function updateLastSeen() { 
  const { data, error } = await supabaseClient
    .from('user_logs')
    .select('last_seen')
    .eq('id', 22)
    .single(); 
  if (error) { 
    return;
  }
 
  const spanElement = document.querySelector('span#lastSeen'); 
  if (data && data.last_seen && spanElement) {
    const dateObj = new Date(data.last_seen); 
    const hours = String(dateObj.getHours()).padStart(2, '0');
    const minutes = String(dateObj.getMinutes()).padStart(2, '0'); 
    spanElement.textContent = `v.0.${hours}${minutes}`;
  } else if (spanElement) {
    spanElement.textContent = 'Belum ada data';
  }
} 
updateLastSeen();
  </script>  
</body>
</html>
