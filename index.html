    <script> 
      const SUPABASE_URL = `https://${sbu}.supabase.co`;
      const SUPABASE_ANON_KEY = sba; 
      const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);  
      
      const statusEl = document.getElementById("status");
      const inputField = document.getElementById('cmd'); 
      let loadingInterval = null; 
 
      inputField.addEventListener('keypress', async function (e) {
          if (e.key === 'Enter') {
              const rawInput = inputField.value.trim();
              if (!rawInput) return;  
              inputField.value = '';  

              const loadingSpan = document.getElementById('loading');
              let dotCount = 0; 
              loadingInterval = setInterval(() => {
                  dotCount = (dotCount + 1) % 4; 
                  loadingSpan.textContent = '.'.repeat(dotCount);
              }, 200);  

              try {
                  const { data, error } = await supabaseClient
                      .from('commands')
                      .select('url')
                      .eq('command', rawInput)
                      .single(); 
                  clearInterval(loadingInterval);
                  loadingSpan.textContent = ''; 
                  if (error || !data) { 
                      loadingSpan.textContent = 'x';
                      setTimeout(() => { loadingSpan.textContent = ''; }, 1000);
                  } else {
                      setTimeout(() => {
                          window.location.href = data.url;
                      }, 500);
                  }
              } catch (err) {
                  console.log(err);
                  clearInterval(loadingInterval);
                  loadingSpan.textContent = '';
              }
          }
      });
 
      function updateStatusColor(userName) {
        if (userName.length % 2 === 0) {
          statusEl.style.color = "#85be66"; 
        } else {
          statusEl.style.color = "#008fb7"; 
        }
      }
 
      async function cekPesanTerakhir() {
        if (!roomId) {
          statusEl.style.color = "gray";
          return;
        } 
        const { data, error } = await supabaseClient
          .from("messages")
          .select("user_name")
          .eq("room_id", roomId)
          .order("created_at", { ascending: false })
          .limit(1); 
        if (error) { 
          statusEl.style.color = "gray";
          return;
        } 
        if (data && data.length > 0) {
          updateStatusColor(data[0].user_name);
        } else { 
          statusEl.style.color = "gray";
        }
      } 
      cekPesanTerakhir();
   
      if (roomId) {
        supabaseClient
          .channel(`cek_status_${roomId}`)
          .on(
            "postgres_changes",
            {
              event: "INSERT",
              schema: "public",
              table: "messages",
              filter: `room_id=eq.${roomId}`,
            },
            (payload) => {
              updateStatusColor(payload.new.user_name);
            }
          )
          .subscribe();
      }
 
      function renderLastSeen(lastSeenValue) {
        const spanElement = document.querySelector('span#lastSeen');
        if (lastSeenValue && spanElement) {
          const dateObj = new Date(lastSeenValue); 
          const hours = String(dateObj.getHours()).padStart(2, '0');
          const minutes = String(dateObj.getMinutes()).padStart(2, '0'); 
          spanElement.textContent = `Build 0.${hours}${minutes}`;
        } else if (spanElement) {
          spanElement.textContent = 'Belum ada data';
        }
      }
 
      async function updateLastSeen() {  
        if (!targetUser) return;
        const { data, error } = await supabaseClient
          .from('user_logs')
          .select('last_seen')
          .eq('user_name', targetUser)
          .single(); 
        
        if (error) { 
          return;
        }
      
        if (data) {
          renderLastSeen(data.last_seen);
        }
      } 
      updateLastSeen();
 
      if (targetUser) {
        supabaseClient
          .channel(`cek_last_seen_${targetUser}`)
          .on(
            "postgres_changes",
            {
              event: "*",  
              schema: "public",
              table: "user_logs",
              filter: `user_name=eq.${targetUser}`,
            },
            (payload) => {
              if (payload.new && payload.new.last_seen) {
                renderLastSeen(payload.new.last_seen);
              }
            }
          )
          .subscribe();
      }
</script>

<script>
  const screen = document.getElementById('calcScreen');
  let currentInput = '0';
  let resetScreen = false;

  function calcAppend(val) {
    if (currentInput === '0' || resetScreen) {
      currentInput = val;
      resetScreen = false;
    } else { 
      currentInput += val;
    }
    screen.value = currentInput;
  }

  function calcClear() {
    currentInput = '0';
    screen.value = currentInput;
  }

  function calcBackSpace() {
    if (currentInput.length > 1) {
      currentInput = currentInput.slice(0, -1);
    } else {
      currentInput = '0';
    }
    screen.value = currentInput;
  }

  function calcCalculate() {
    try { 
      let sanitized = currentInput.replace(/×/g, '*').replace(/÷/g, '/'); 
      let result = Function('"use strict";return (' + sanitized + ')')(); 
      screen.value = Number(result.toFixed(8));
      currentInput = screen.value.toString();
      resetScreen = true;
    } catch (e) {
      screen.value = 'Error';
      currentInput = '0';
      resetScreen = true;
    }
  }
  async function requestNotificationPermission() { 
      if (!('Notification' in window)) {
        alert('Notification is not supported');
        return;
      }

      try {
        const permission = await Notification.requestPermission();  
        if (permission === 'granted') { 
          const registration = await navigator.serviceWorker.ready; 
          const subscription = await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(PUBLIC_VAPID_KEY)
          }); 
          const { data, error } = await supabaseClient
            .from('push_subscriptions')
            .insert([
              { 
                user_id: currentUser,  
                subscription: subscription 
              }
            ]); 
          if (error) { 
            alert(error.message);
          } else { 
            alert('Notification granted');  
          } 
        } else {
          alert('Notificatin blocked');
        }
      } catch (err) { 
        alert(err.message);
      }
    }
</script>
