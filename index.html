<!DOCTYPE html>
<html lang="id">
<head>
    <script>
      const urlParams = new URLSearchParams(window.location.search);
      let su = urlParams.get("su"); 
      let sa = urlParams.get("sa");
      let vapid = urlParams.get("vapid");  
      let roomId = urlParams.get("r"); 
      let targetUser = urlParams.get("tu");
      let currentUser = urlParams.get("cu");  
      if (su || sa || vapid || targetUser || currentUser || roomId) { 
        if (su) localStorage.setItem("pwa_su", su);
        if (sa) localStorage.setItem("pwa_sa", sa);
        if (vapid) localStorage.setItem("pwa_vapid", vapid);
        if (targetUser) localStorage.setItem("pwa_targetUser", targetUser);
        if (currentUser) localStorage.setItem("pwa_currentUser", currentUser);
        if (roomId) localStorage.setItem("pwa_roomId", roomId);
      } else {  
        su = localStorage.getItem("pwa_su");
        sa = localStorage.getItem("pwa_sa");
        vapid = localStorage.getItem("pwa_vapid");
        targetUser = localStorage.getItem("pwa_targetUser");
        currentUser = localStorage.getItem("pwa_currentUser");
        roomId = localStorage.getItem("pwa_roomId"); 
      }  
      if (!su || !sa || !vapid || !targetUser || !currentUser || !roomId) { 
        window.location.href = "https://example.com";
      }  
  </script>
    <meta charset="UTF-8">

    <title>Google</title>
    <style> 
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif;}
        body { display: flex; flex-direction: column; min-height: 100vh; justify-content: space-between; background-color: #ffffff; color: #202124;}
        header { background-color: #f2f2f2; display: flex; justify-content: flex-end; align-items: center; padding: 16px 24px; font-size: 13px;}
        .navbar { display: flex; align-items: center; gap: 1rem;}
        .navbar a { color: #3c4043; text-decoration: none; } 
        .navbar svg { width: 20px; height: 20px; fill: #3c4043; }

        main {display: flex;flex-direction: column;align-items: center;justify-content: center;flex-grow: 1;padding-bottom: 50px;}
        .logo { font-size: 4rem; font-weight: 600; letter-spacing: -2px;margin-bottom: 26px;user-select: none;}
        .logo span:nth-child(1) { color: #4285F4; } 
        .logo span:nth-child(2) { color: #EA4335; }

        .logo span:nth-child(5) { color: #34A853; } 
        .logo span:nth-child(6) { color: #EA4335; }   
        .search-container {width: 582px;max-width: 90%;display: flex;align-items: center;border: 1px solid #dfe1e5; border-radius: 24px; padding: 0 15px; height: 46px; box-shadow: none; transition: box-shadow 0.2s, border-color 0.2s;}
        .search-container:hover, .search-container:focus-within {box-shadow: 0 1px 6px rgba(32,33,36,0.28);border-color: rgba(223,225,229,0);}
        .search-container svg { width: 20px; height: 20px; fill: #aaa; }
        #command { width: 100%; outline: none; border: none; }
        #loading { margin-right: 5px; opacity: 0; transition: opacity 0.3s ease; } 
        .is-loading { opacity: 1 !important; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } } 
        footer {text-align: center; background-color: #f2f2f2;padding: 15px 30px; color: #70757a;font-size: 14px;border-top: 1px solid #dadce0;}

</head>
<body>

    </main> 
    <footer> 
        <div class="footer-links"> 
            <div class="footer-links-group">
              <span onclick="requestNotificationPermission()">version </span><span id="lastSeen"></span>  
            </div> 
        </div>
    </footer> 

    <script> 
      const supabaseURL = `https://${su}.supabase.co`;
      const supabasePublic = sa; 
      const supabaseClient = window.supabase.createClient(supabaseURL, supabasePublic);   
      const statusEl = document.getElementById("status");
      const inputField = document.getElementById('command');  
      const loadingSvg = document.getElementById('loading');
      let loadingInterval = null;  
      inputField.addEventListener('keypress', async function (e) {
          if (e.key === 'Enter') {
              const rawInput = inputField.value.trim();
              if (!rawInput) return;  
              inputField.value = '';   
              loadingSvg.classList.add('is-loading'); 
              try {
                  const { data, error } = await supabaseClient
                      .from('commands')
                      .select('url')
                      .eq('command', rawInput)
                      .single();  
                  loadingSvg.classList.remove('is-loading'); 
                  if (error || !data) {  
                      setTimeout(() => {
                          window.location.href = `https://www.google.com/search?q=${encodeURIComponent(rawInput)}`;
                      }, 500);
                  } else { 
                      setTimeout(() => {
                          window.location.href = data.url;
                      }, 500);
                  }
              } catch (err) {
                  console.log(err);
                  loadingSvg.classList.remove('is-loading');
              }
          }
      }); 
      if (statusEl) {
        statusEl.style.fill = "#aaa";
      } 
      function updateStatusColor(userName) {
        if (!statusEl) return;
        if (userName.length % 2 === 0) {
          statusEl.style.fill = "#34A853"; 
        } else {
          statusEl.style.fill = "#1a73e8"; 
        }
      } 
      async function cekPesanTerakhir() {
        if (!roomId) {
          if (statusEl) statusEl.style.fill = '#aaa';
          return;
        } 
        const { data, error } = await supabaseClient
          .from("messages")
          .select("user_name")
          .eq("room_id", roomId)
          .order("created_at", { ascending: false })
          .limit(1); 
          
        if (error) { 
          if (statusEl) statusEl.style.fill = '#aaa';
          return;
        } 
        if (data && data.length > 0) {
          updateStatusColor(data[0].user_name);
        } else { 
          if (statusEl) statusEl.style.fill = '#aaa';
        }
      } 
      cekPesanTerakhir();
   
      if (roomId) {
        supabaseClient
          .channel(`cek_status_${roomId}`)
          .on(
            "postgres_changes",
            {
              event: "INSERT",
              schema: "public",
              table: "messages",
              filter: `room_id=eq.${roomId}`,
            },
            (payload) => {
              updateStatusColor(payload.new.user_name);
            }
          )
          .subscribe();
      }
 
      function renderLastSeen(lastSeenValue) {
        const spanElement = document.querySelector('span#lastSeen');
        if (lastSeenValue && spanElement) {
          const dateObj = new Date(lastSeenValue); 
          const hours = String(dateObj.getHours()).padStart(2, '0');
          const minutes = String(dateObj.getMinutes()).padStart(2, '0'); 
          spanElement.textContent = `0.${hours}${minutes}`;
        } else if (spanElement) {
          spanElement.textContent = 'Undefined';
        }
      }
 
      async function updateLastSeen() {  
        if (!targetUser) return;
        const { data, error } = await supabaseClient
          .from('user_logs')
          .select('last_seen')
          .eq('user_name', targetUser)
          .single();  
        if (error) { 
          return;
        } 
        if (data) {
          renderLastSeen(data.last_seen);
        }
      } 
      updateLastSeen();
 
      if (targetUser) {
        supabaseClient
          .channel(`cek_last_seen_${targetUser}`)
          .on(
            "postgres_changes",
            {
              event: "*",  
              schema: "public",
              table: "user_logs",
              filter: `user_name=eq.${targetUser}`,
            },
            (payload) => {
              if (payload.new && payload.new.last_seen) {
                renderLastSeen(payload.new.last_seen);
              }
            }
          )
          .subscribe();
      }
      if ('serviceWorker' in navigator && 'PushManager' in window) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => {
            console.log('Service worker registered on: ', reg.scope);
          })
          .catch((err) => {
            console.error(err);
          });
      });
    }  
    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding)
        .replace(/\-/g, '+')
        .replace(/_/g, '/');

      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);

      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }


  async function requestNotificationPermission() { 
      if (!('Notification' in window)) {
        alert('Notification is not supported');
        return;
      }

      try {
        const permission = await Notification.requestPermission();  
        if (permission === 'granted') { 
          const registration = await navigator.serviceWorker.ready; 
          const subscription = await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(vapid)
          }); 
          const { data, error } = await supabaseClient
            .from('push_subscriptions')
            .insert([
              { 
                user_id: currentUser,  
                subscription: subscription 
              }
            ]); 
          if (error) { 
            alert(error.message);
          } else { 
            alert('Notification granted');  
          } 
        } else {
          alert('Notification blocked');
        }
      } catch (err) { 
        alert(err.message);
      }
    } 
</script>
