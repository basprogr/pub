<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  
    <style>
        *{box-sizing: border-box;}
        body { font-family: monospace;  background-color: #f4f5f7; color: #333333; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh;} 
        nav { width: 100%; background-color: #295d84; color: white; padding: 10px 20px;  display: flex; justify-content: space-between; align-items: center;} 
        .nav2 { width: 100%; background-color: #ffffff; padding: 5px 20px;   color: #666; border-bottom: 1px solid #dcdcdc;   font-size: 0.8rem;} 
        .container { background-color: #ffffff; max-width: 500px; width: 95%; margin: 10px; padding: 15px; border: 1px solid #dcdcdc;  border-radius: 4px;   box-shadow: 0 2px 5px rgba(0, 0, 0, 0.02);  } 
        a {  display: block; margin-bottom: 5px;  text-decoration: none;  color: #5f8949; } 
        #main { height: 200px; width: 100%; max-width: 500px; display: flex; }
        .child { flex: 1; }  
    </style>
</head>
<body> 
    <nav>
        <span>public</span>
        <span id="status">&#x25FC;</span>  
    </nav>  
    <div class="nav2">pub<span id="indicator">/</span>index</div> 
    <div class="container">    
      <a href="log.html">📝 Logbook</a>
      <a href="https://mp3juice.co">🎧 Download Mp3</a>  
        <a href="https://www.google.com/search?q=proxy">📡 Proxy</a>
        <a href="https://forms.gle/mF35fpoFdKxmHwiq7">💧 Suhu Kamar</a>  
    </div> 
    <div id="main">
        <div id="child1" class="child"></div>
        <div id="child2" class="child"></div>
    </div> 
    <script>  
      let combination = "";
      const indicator = document.getElementById("indicator"); 
      const routes = {
        "11212212": "https://basprogr.github.io/msgs/index.html?r=oNVbmxMLxvsQpAke&u=bas", 
        "12121212": "https://asd.fwh.is/contact",
        "11112222": "https://asd.fwh.is/login.php",
        "11111112": "https://asd.fwh.is/link",
      }; 
      document.getElementById("child1").addEventListener("click", () => { addDigit("1"); }); 
      document.getElementById("child2").addEventListener("click", () => { addDigit("2"); }); 
      function addDigit(digit) {
        combination += digit;
        indicator.innerText = '\\';  
        checkCombination();
      } 
      function checkCombination() {
        if (routes[combination]) { 
          window.location.href = routes[combination];
        } else if (combination.length >= 8) { 
          combination = "";
          indicator.innerText = ".";  
        }
      }  
      
      const SUPABASE_URL = "https://qjwmhtnfowkmwoflwhzy.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_-vCSXzmIWSM9kn7VHWRhjg_g2B5IYXF"; 
      const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);  
      const urlParams = new URLSearchParams(window.location.search);
      const roomId = urlParams.get("r"); 
      const statusEl = document.getElementById("status");
  
      function updateStatusColor(userName) {
        if (userName === "dalq") {
          statusEl.style.color = "#85be66";  
        } else {
          statusEl.style.color = "#008fb7";  
        }
      } 
      async function cekPesanTerakhir() {
        if (!roomId) {
          statusEl.style.color = "gray";
          return;
        } 
        const { data, error } = await supabaseClient
          .from("messages")
          .select("user_name")
          .eq("room_id", roomId)
          .order("created_at", { ascending: false })
          .limit(1); 
        if (error) {
          console.error("Gagal mengecek pesan:", error);
          statusEl.style.color = "gray";
          return;
        } 
        if (data && data.length > 0) {
          updateStatusColor(data[0].user_name);
        } else { 
          statusEl.style.color = "gray";
        }
      } 
      cekPesanTerakhir();
  
      supabaseClient
        .channel(`cek_status_${roomId}`)
        .on(
          "postgres_changes",
          {
            event: "INSERT",
            schema: "public",
            table: "messages",
            filter: `room_id=eq.${roomId}`,
          },
          (payload) => {
            updateStatusColor(payload.new.user_name);
          }
        )
        .subscribe();
  </script>  
</body>
</html>
