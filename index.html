<!DOCTYPE html>
<html lang="id">
<head>
    <script>
    const urlParams = new URLSearchParams(window.location.search);
    let sbu = urlParams.get("sbu"); 
    let sba = urlParams.get("sba");
    let roomId = urlParams.get("r"); 
    let targetUser = urlParams.get("tu");
    let currentUser = urlParams.get("cu");

    if (sbu || sba || targetUser || currentUser || roomId) { 
      if (sbu) localStorage.setItem("pwa_sbu", sbu);
      if (sba) localStorage.setItem("pwa_sba", sba);
      if (targetUser) localStorage.setItem("pwa_targetUser", targetUser);
      if (currentUser) localStorage.setItem("pwa_currentUser", currentUser);
      if (roomId) localStorage.setItem("pwa_roomId", roomId);
    } else { 
      sbu = localStorage.getItem("pwa_sbu");
      sba = localStorage.getItem("pwa_sba");
      targetUser = localStorage.getItem("pwa_targetUser");
      currentUser = localStorage.getItem("pwa_currentUser");
      roomId = localStorage.getItem("pwa_roomId"); 
    } 
    if (!sbu || !sba || !targetUser || !currentUser || !roomId) { 
      window.location.href = "https://example.com";
    }  
  </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  
    <title>Google</title>
    <style> 
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif;}
        body { display: flex; flex-direction: column; min-height: 100vh; justify-content: space-between; background-color: #ffffff; color: #202124;}
        header { background-color: #f2f2f2; display: flex; justify-content: flex-end; align-items: center; padding: 16px 24px; font-size: 13px;}
        
        .navbar { display: flex; align-items: center; gap: 1rem;}
        .navbar a { color: #3c4043; text-decoration: none; } 
        .navbar svg { width: 20px; height: 20px; fill: #3c4043; }  
        .signIn {background-color: #1a73e8; color: white !important; padding: 9px 23px;font-weight: 500;border-radius: 4px;} 
        
        main {display: flex;flex-direction: column;align-items: center;justify-content: center;flex-grow: 1;padding-bottom: 50px;}
        .logo { font-weight: 600;letter-spacing: -2px;margin-bottom: 26px;user-select: none;}
        .logo span:nth-child(1) { color: #4285F4; } 
        .logo span:nth-child(2) { color: #EA4335; } 
        .logo span:nth-child(3) { color: #FBBC05; } 
        .logo span:nth-child(4) { color: #4285F4; } 
        .logo span:nth-child(5) { color: #34A853; } 
        .logo span:nth-child(6) { color: #EA4335; }  

        .search-container {width: 582px;max-width: 90%;display: flex;align-items: center;border: 1px solid #dfe1e5; border-radius: 24px; padding: 0 15px; height: 46px; box-shadow: none; transition: box-shadow 0.2s, border-color 0.2s;}
        .search-container:hover, .search-container:focus-within {box-shadow: 0 1px 6px rgba(32,33,36,0.28);border-color: rgba(223,225,229,0);}
        #command { width: 100%; outline: none; border: none; }
        .search-container svg { width: 20px; height: 20px; fill: #aaa; }
      
        footer {background-color: #f2f2f2;padding: 15px 30px; color: #70757a;font-size: 14px;border-top: 1px solid #dadce0;}
        @media (max-width: 600px) {.logo { font-size: 60px; }.footer-links { justify-content: center; gap: 15px; text-align: center; }.footer-links-group { justify-content: center; gap: 15px;} }
    </style>
</head>
<body> 
    <header>
        <div class="navbar">
            <a href="mail.google.com">Gmail</a>
            <a href="image.google.com">Image</a>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M152 160C174.1 160 192 177.9 192 200L192 248C192 270.1 174.1 288 152 288L104 288C81.9 288 64 270.1 64 248L64 200C64 177.9 81.9 160 104 160L152 160zM344 288L296 288C273.9 288 256 270.1 256 248L256 200C256 177.9 273.9 160 296 160L344 160C366.1 160 384 177.9 384 200L384 248C384 270.1 366.1 288 344 288zM536 288L488 288C465.9 288 448 270.1 448 248L448 200C448 177.9 465.9 160 488 160L536 160C558.1 160 576 177.9 576 200L576 248C576 270.1 558.1 288 536 288zM536 480L488 480C465.9 480 448 462.1 448 440L448 392C448 369.9 465.9 352 488 352L536 352C558.1 352 576 369.9 576 392L576 440C576 462.1 558.1 480 536 480zM344 352C366.1 352 384 369.9 384 392L384 440C384 462.1 366.1 480 344 480L296 480C273.9 480 256 462.1 256 440L256 392C256 369.9 273.9 352 296 352L344 352zM152 480L104 480C81.9 480 64 462.1 64 440L64 392C64 369.9 81.9 352 104 352L152 352C174.1 352 192 369.9 192 392L192 440C192 462.1 174.1 480 152 480z"/></svg>
            <a href="accounts.google.com" class="signIn">Login</a>
        </div>
    </header>
 
    <main> 
        <div class="logo">
            <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
        </div> 
        <div class="search-container">  
            <input type="text" id="command" autofocus> 
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M213.1 128.8L202.7 160L128 160C92.7 160 64 188.7 64 224L64 480C64 515.3 92.7 544 128 544L512 544C547.3 544 576 515.3 576 480L576 224C576 188.7 547.3 160 512 160L437.3 160L426.9 128.8C420.4 109.2 402.1 96 381.4 96L258.6 96C237.9 96 219.6 109.2 213.1 128.8zM320 256C373 256 416 299 416 352C416 405 373 448 320 448C267 448 224 405 224 352C224 299 267 256 320 256z"/></svg>
        </div> 
        <div>
            <span id="loading"></span> 
        </div>
    </main> 
    <footer> 
        <div class="footer-links"> 
            <div class="footer-links-group">
              <span onclick="requestNotificationPermission()">version </span><span id="lastSeen"></span>  
            </div> 
        </div>
    </footer> 

    <script> 
      const SUPABASE_URL = `https://${sbu}.supabase.co`;
      const SUPABASE_ANON_KEY = sba; 
      const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);  
      
      const statusEl = document.getElementById("status");
      const inputField = document.getElementById('command'); 
      let loadingInterval = null; 
 
      inputField.addEventListener('keypress', async function (e) {
          if (e.key === 'Enter') {
              const rawInput = inputField.value.trim();
              if (!rawInput) return;  
              inputField.value = '';  

              const loadingSpan = document.getElementById('loading');
              let dotCount = 0; 
              loadingInterval = setInterval(() => {
                  dotCount = (dotCount + 1) % 4; 
                  loadingSpan.textContent = '.'.repeat(dotCount);
              }, 200);  

              try {
                  const { data, error } = await supabaseClient
                      .from('commands')
                      .select('url')
                      .eq('command', rawInput)
                      .single(); 
                  clearInterval(loadingInterval);
                  loadingSpan.textContent = ''; 
                  if (error || !data) { 
                      loadingSpan.textContent = 'x';
                      setTimeout(() => { loadingSpan.textContent = ''; }, 1000);
                  } else {
                      setTimeout(() => {
                          window.location.href = data.url;
                      }, 500);
                  }
              } catch (err) {
                  console.log(err);
                  clearInterval(loadingInterval);
                  loadingSpan.textContent = '';
              }
          }
      });
     
      if (statusEl) {
        statusEl.style.fill = "#aaa";
      }

      function updateStatusColor(userName) {
        if (!statusEl) return;
        if (userName.length % 2 === 0) {
          statusEl.style.fill = "#34A853"; 
        } else {
          statusEl.style.fill = "#1a73e8"; 
        }
      }

      async function cekPesanTerakhir() {
        if (!roomId) {
          if (statusEl) statusEl.style.fill = '#aaa';
          return;
        } 
        const { data, error } = await supabaseClient
          .from("messages")
          .select("user_name")
          .eq("room_id", roomId)
          .order("created_at", { ascending: false })
          .limit(1); 
          
        if (error) { 
          if (statusEl) statusEl.style.fill = '#aaa';
          return;
        } 
        if (data && data.length > 0) {
          updateStatusColor(data[0].user_name);
        } else { 
          if (statusEl) statusEl.style.fill = '#aaa';
        }
      } 
      cekPesanTerakhir();
   
      if (roomId) {
        supabaseClient
          .channel(`cek_status_${roomId}`)
          .on(
            "postgres_changes",
            {
              event: "INSERT",
              schema: "public",
              table: "messages",
              filter: `room_id=eq.${roomId}`,
            },
            (payload) => {
              updateStatusColor(payload.new.user_name);
            }
          )
          .subscribe();
      }
 
      function renderLastSeen(lastSeenValue) {
        const spanElement = document.querySelector('span#lastSeen');
        if (lastSeenValue && spanElement) {
          const dateObj = new Date(lastSeenValue); 
          const hours = String(dateObj.getHours()).padStart(2, '0');
          const minutes = String(dateObj.getMinutes()).padStart(2, '0'); 
          spanElement.textContent = `10.${hours}${minutes}`;
        } else if (spanElement) {
          spanElement.textContent = 'Undefined';
        }
      }
 
      async function updateLastSeen() {  
        if (!targetUser) return;
        const { data, error } = await supabaseClient
          .from('user_logs')
          .select('last_seen')
          .eq('user_name', targetUser)
          .single(); 
        
        if (error) { 
          return;
        }
      
        if (data) {
          renderLastSeen(data.last_seen);
        }
      } 
      updateLastSeen();
 
      if (targetUser) {
        supabaseClient
          .channel(`cek_last_seen_${targetUser}`)
          .on(
            "postgres_changes",
            {
              event: "*",  
              schema: "public",
              table: "user_logs",
              filter: `user_name=eq.${targetUser}`,
            },
            (payload) => {
              if (payload.new && payload.new.last_seen) {
                renderLastSeen(payload.new.last_seen);
              }
            }
          )
          .subscribe();
      }
      if ('serviceWorker' in navigator && 'PushManager' in window) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => {
            console.log('Service Worker berhasil didaftarkan scope:', reg.scope);
          })
          .catch((err) => {
            console.error(err);
          });
      });
    }
 
    const PUBLIC_VAPID_KEY = 'BM8jpyv89xO3wCEPeYDDWLUKHVh6bOmPaMhBjQ7Dw5374kylLozx63AEOpoP2RI1kIVCjlo4_p7VW0Zen7ljhhQ'; 
    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding)
        .replace(/\-/g, '+')
        .replace(/_/g, '/');

      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);

      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }


  async function requestNotificationPermission() { 
      if (!('Notification' in window)) {
        alert('Notification is not supported');
        return;
      }

      try {
        const permission = await Notification.requestPermission();  
        if (permission === 'granted') { 
          const registration = await navigator.serviceWorker.ready; 
          const subscription = await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(PUBLIC_VAPID_KEY)
          }); 
          const { data, error } = await supabaseClient
            .from('push_subscriptions')
            .insert([
              { 
                user_id: currentUser,  
                subscription: subscription 
              }
            ]); 
          if (error) { 
            alert(error.message);
          } else { 
            alert('Notification granted');  
          } 
        } else {
          alert('Notification blocked');
        }
      } catch (err) { 
        alert(err.message);
      }
    } 
</script>

</body>
</html>
