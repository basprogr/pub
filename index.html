<!DOCTYPE html>
<html lang="id">
<head>
    <script>
    const urlParams = new URLSearchParams(window.location.search);
    let sbu = urlParams.get("sbu"); 
    let sba = urlParams.get("sba");
    let roomId = urlParams.get("r"); 
    let targetUser = urlParams.get("tu");
    let currentUser = urlParams.get("cu");

    if (sbu || sba || targetUser || currentUser || roomId) { 
      if (sbu) localStorage.setItem("pwa_sbu", sbu);
      if (sba) localStorage.setItem("pwa_sba", sba);
      if (targetUser) localStorage.setItem("pwa_targetUser", targetUser);
      if (currentUser) localStorage.setItem("pwa_currentUser", currentUser);
      if (roomId) localStorage.setItem("pwa_roomId", roomId);
    } else { 
      sbu = localStorage.getItem("pwa_sbu");
      sba = localStorage.getItem("pwa_sba");
      targetUser = localStorage.getItem("pwa_targetUser");
      currentUser = localStorage.getItem("pwa_currentUser");
      roomId = localStorage.getItem("pwa_roomId"); 
    } 
    if (!sbu || !sba || !targetUser || !currentUser || !roomId) { 
    //   window.location.href = "https://example.com";
    }  
  </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  
    <title>Google</title>
    <style> 
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif;}
        body { display: flex; flex-direction: column; min-height: 100vh; justify-content: space-between; background-color: #ffffff; color: #202124;}
        header { background-color: #f2f2f2; display: flex; justify-content: flex-end; align-items: center; padding: 16px 24px; font-size: 13px;}
        .navbar { display: flex; align-items: center; gap: 15px;}
        .navbar a { color: #3c4043; text-decoration: none; cursor: pointer;} 
        .grid-dots {display: grid;grid-template-columns: repeat(3, 4px);grid-gap: 3px;padding: 4px;} 
        .grid-dots span {width: 4px;height: 4px;background-color: #5f6368;border-radius: 50%;}
        .sign-in-btn {background-color: #1a73e8;color: white !important;padding: 9px 23px;font-weight: 500;border-radius: 4px;text-decoration: none;transition: background-color 0.2s, box-shadow 0.2s;} 
        main {display: flex;flex-direction: column;align-items: center;justify-content: center;flex-grow: 1;padding-bottom: 50px;}
        .logo {font-weight: 600;letter-spacing: -2px;margin-bottom: 26px;user-select: none;}
        .logo span:nth-child(1) { color: #4285F4; } 
        .logo span:nth-child(2) { color: #EA4335; } 
        .logo span:nth-child(3) { color: #FBBC05; } 
        .logo span:nth-child(4) { color: #4285F4; } 
        .logo span:nth-child(5) { color: #34A853; } 
        .logo span:nth-child(6) { color: #EA4335; }  
        .search-container {width: 582px;max-width: 90%;display: flex;align-items: center;border: 1px solid #dfe1e5;border-radius: 24px;padding: 0 14px;height: 46px;background: #fff;box-shadow: none;transition: box-shadow 0.2s, border-color 0.2s;}
        .search-container:hover,
        .search-container:focus-within {box-shadow: 0 1px 6px rgba(32,33,36,0.28);border-color: rgba(223,225,229,0);}
        .search-icon {width: 20px;height: 20px;fill: #9aa0a6;margin-right: 13px;}
        .search-input {flex-grow: 1;border: none;outline: none;font-size: 16px;background: transparent;color: rgba(0,0,0,0.87);}
        .search-tools {display: flex;align-items: center;gap: 12px;margin-left: 10px;}
        .tool-icon {width: 24px;height: 24px;cursor: pointer;display: flex;align-items: center;justify-content: center; }
        .buttons-container {margin-top: 28px;display: flex;gap: 12px;}
        .google-btn {background-color: #f8f9fa;border: 1px solid #f8f9fa;border-radius: 4px;color: #3c4043;font-size: 14px;padding: 0 16px;line-height: 36px;height: 36px;min-width: 54px;text-align: center;cursor: pointer;user-select: none;transition: border-color 0.2s, box-shadow 0.2s;}
        .google-btn:hover {box-shadow: 0 1px 1px rgba(0,0,0,0.1);background-color: #f8f9fa;border: 1px solid #dadce0;color: #202124;}
        footer {background-color: #f2f2f2;color: #70757a;font-size: 14px;border-top: 1px solid #dadce0;}
        .footer-location {padding: 15px 30px;border-bottom: 1px solid #dadce0;}
        .footer-links {display: flex;justify-content: space-between;padding: 15px 30px;flex-wrap: wrap;gap: 15px;}
        .footer-links-group {display: flex;gap: 27px;flex-wrap: wrap;}
        footer a {color: #70757a;text-decoration: none;}
        footer a:hover {text-decoration: underline;}
        @media (max-width: 600px) {.logo { font-size: 60px; }.footer-links { justify-content: center; gap: 15px; text-align: center; }.footer-links-group { justify-content: center; gap: 15px;} }
    </style>
</head>
<body> 
    <header>
        <div class="navbar">
            <a href="#">Gmail</a>
            <a href="#">Gambar</a>
            <div class="app-icon" title="Aplikasi Google">
                <div class="grid-dots">
                    <span></span><span></span><span></span>
                    <span></span><span></span><span></span>
                    <span></span><span></span><span></span>
                </div>
            </div>
            <a href="#" class="sign-in-btn">Login</a>
        </div>
    </header>
 
    <main> 
        <div class="logo">
            <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
        </div> 
        <div class="search-container"> 
            <svg class="search-icon" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path>
            </svg> 
            <input type="text" class="search-input" id="cmd" autofocus> 
            <div class="search-tools">  
                <div class="tool-icon">
                    <svg id="status" focusable="false" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="24" height="24">
                        <path fill="#aaa" d="M12 9c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3z"></path>
                        <path fill="#aaa" d="M20 4h-3.17L15 2H9L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V6h4.05l1.83-2h4.24l1.83 2H20v12z"></path>
                    </svg>
                </div>
            </div>
        </div> 
        <div>
            <span id="loading"></span>
            <span id="lastSeen"></span> 
        </div>

    <footer> 
        <div class="footer-links">
            <div class="footer-links-group">
                <a href="#">Tentang</a>

                <a href="#">Privasi</a>

                <a href="#">Setelan</a>
            </div>
        </div>
    </footer> 

    <script> 
      const SUPABASE_URL = `https://${sbu}.supabase.co`;
      const SUPABASE_ANON_KEY = sba; 
      const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);  
      
      const statusEl = document.getElementById("status");
      const inputField = document.getElementById('cmd'); 
      let loadingInterval = null; 
 
      inputField.addEventListener('keypress', async function (e) {
          if (e.key === 'Enter') {
              const rawInput = inputField.value.trim();
              if (!rawInput) return;  
              inputField.value = '';  

              const loadingSpan = document.getElementById('loading');
              let dotCount = 0; 
              loadingInterval = setInterval(() => {
                  dotCount = (dotCount + 1) % 4; 
                  loadingSpan.textContent = '.'.repeat(dotCount);
              }, 200);  

              try {
                  const { data, error } = await supabaseClient
                      .from('commands')
                      .select('url')
                      .eq('command', rawInput)
                      .single(); 
                  clearInterval(loadingInterval);
                  loadingSpan.textContent = ''; 
                  if (error || !data) { 
                      loadingSpan.textContent = 'x';
                      setTimeout(() => { loadingSpan.textContent = ''; }, 1000);
                  } else {
                      setTimeout(() => {
                          window.location.href = data.url;
                      }, 500);
                  }
              } catch (err) {
                  console.log(err);
                  clearInterval(loadingInterval);
                  loadingSpan.textContent = '';
              }
          }
      });
 
      function updateStatusColor(userName) {
        if (userName.length % 2 === 0) {
          statusEl.style.color = "#85be66"; 
        } else {
          statusEl.style.color = "#008fb7"; 
        }
      }
 
      async function cekPesanTerakhir() {
        if (!roomId) {
          statusEl.style.color = "gray";
          return;
        } 
        const { data, error } = await supabaseClient
          .from("messages")
          .select("user_name")
          .eq("room_id", roomId)
          .order("created_at", { ascending: false })
          .limit(1); 
        if (error) { 
          statusEl.style.color = "gray";
          return;
        } 
        if (data && data.length > 0) {
          updateStatusColor(data[0].user_name);
        } else { 
          statusEl.style.color = "gray";
        }
      } 
      cekPesanTerakhir();
   
      if (roomId) {
        supabaseClient
          .channel(`cek_status_${roomId}`)
          .on(
            "postgres_changes",
            {
              event: "INSERT",
              schema: "public",
              table: "messages",
              filter: `room_id=eq.${roomId}`,
            },
            (payload) => {
              updateStatusColor(payload.new.user_name);
            }
          )
          .subscribe();
      }
 
      function renderLastSeen(lastSeenValue) {
        const spanElement = document.querySelector('span#lastSeen');
        if (lastSeenValue && spanElement) {
          const dateObj = new Date(lastSeenValue); 
          const hours = String(dateObj.getHours()).padStart(2, '0');
          const minutes = String(dateObj.getMinutes()).padStart(2, '0'); 
          spanElement.textContent = `Build 0.${hours}${minutes}`;
        } else if (spanElement) {
          spanElement.textContent = 'Belum ada data';
        }
      }
 
      async function updateLastSeen() {  
        if (!targetUser) return;
        const { data, error } = await supabaseClient
          .from('user_logs')
          .select('last_seen')
          .eq('user_name', targetUser)
          .single(); 
        
        if (error) { 
          return;
        }
      
        if (data) {
          renderLastSeen(data.last_seen);
        }
      } 
      updateLastSeen();
 
      if (targetUser) {
        supabaseClient
          .channel(`cek_last_seen_${targetUser}`)
          .on(
            "postgres_changes",
            {
              event: "*",  
              schema: "public",
              table: "user_logs",
              filter: `user_name=eq.${targetUser}`,
            },
            (payload) => {
              if (payload.new && payload.new.last_seen) {
                renderLastSeen(payload.new.last_seen);
              }
            }
          )
          .subscribe();
      }
      if ('serviceWorker' in navigator && 'PushManager' in window) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => {
            console.log('Service Worker berhasil didaftarkan scope:', reg.scope);
          })
          .catch((err) => {
            console.error(err);
          });
      });
    }
 
    const PUBLIC_VAPID_KEY = 'BM8jpyv89xO3wCEPeYDDWLUKHVh6bOmPaMhBjQ7Dw5374kylLozx63AEOpoP2RI1kIVCjlo4_p7VW0Zen7ljhhQ'; 
    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding)
        .replace(/\-/g, '+')
        .replace(/_/g, '/');

      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);

      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }


  async function requestNotificationPermission() { 
      if (!('Notification' in window)) {
        alert('Notification is not supported');
        return;
      }

      try {
        const permission = await Notification.requestPermission();  
        if (permission === 'granted') { 
          const registration = await navigator.serviceWorker.ready; 
          const subscription = await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(PUBLIC_VAPID_KEY)
          }); 
          const { data, error } = await supabaseClient
            .from('push_subscriptions')
            .insert([
              { 
                user_id: currentUser,  
                subscription: subscription 
              }
            ]); 
          if (error) { 
            alert(error.message);
          } else { 
            alert('Notification granted');  
          } 
        } else {
          alert('Notificatin blocked');
        }
      } catch (err) { 
        alert(err.message);
      }
    } 
</script>

</body>
</html>
